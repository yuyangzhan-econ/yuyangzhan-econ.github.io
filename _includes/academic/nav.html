<header class="site-header">
  <nav class="navigation" aria-label="Main navigation">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.name }}</a>
    <div class="nav-links">
      {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode" hidden>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
      </button>
    </div>
  </nav>
</header>
