# Academic homepage. The original site is preserved on backup/pre-redesign-2026-09-08.
locale: en-US
title: Yuyang Zhan
name: Yuyang Zhan
title_separator: "·"
description: "Yuyang Zhan is a visiting student at UC Berkeley, an economics graduate of Renmin University of China, and an incoming MIT DEDP master's student."
url: https://yuyangzhan-econ.github.io
baseurl: ""
repository: yuyangzhan-econ/yuyangzhan-econ.github.io
site_theme: default
author:
  name: Yuyang Zhan
  chinese_name: 詹禹阳
  avatar: image.png
  bio: Visiting Student
  location: Berkeley, CA
  employer: University of California, Berkeley
  university_url: https://www.berkeley.edu/
  email: yuyang.zhan@berkeley.edu
  github: yuyangzhan-econ
cv_path: "/CV/Yuyang Zhan CV.pdf"
publication_category:
  books:
    title: Books
  manuscripts:
    title: Journal Articles
  conferences:
    title: Conference Papers
breadcrumbs: false
future: true
read_more: disabled
talkmap_link: false
atom_feed:
  hide: true
include: [".htaccess", "_pages", "files"]
exclude:
  - .github
  - .bundle
  - .sass-cache
  - vendor
  - node_modules
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - REDESIGN.md
  - tools
encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC
plugins: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]
whitelist: [jekyll-feed, jekyll-gist, jekyll-paginate, jekyll-sitemap, jekyll-redirect-from, jemoji]
compress_html:
  clippings: all
  blanklines: true
